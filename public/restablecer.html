<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#16233b">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Nueva contraseña · Tutómbola!</title>
<link rel="icon" href="/icono.svg">
<link rel="stylesheet" href="/estilos.css">
<style>
  .marca { font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 26px; color: var(--tinta); text-decoration: none; display: block; text-align: center; margin: 28px 0 18px; }
  .marca span { color: var(--acento); }
  .caja { max-width: 420px; margin: 0 auto; }
</style>
</head>
<body>
<main>
  <a class="marca" href="/">Tu<span>tómbola!</span></a>
  <div class="caja">
    <form class="tarjeta" id="f-nueva">
      <h2 style="margin:0 0 6px">Elegí tu contraseña nueva</h2>
      <p class="ayuda" style="margin:0 0 14px">Este link sirve una sola vez. Después vas a entrar directo a tu panel.</p>
      <div class="campo"><label for="n-pass">Contraseña nueva</label><input type="password" id="n-pass" autocomplete="new-password" minlength="8" required><div class="ayuda">Mínimo 8 caracteres.</div></div>
      <div class="campo"><label for="n-pass2">Repetila</label><input type="password" id="n-pass2" autocomplete="new-password" minlength="8" required></div>
      <div data-error></div>
      <button class="btn oscuro bloque" type="submit">Guardar y entrar</button>
    </form>
  </div>
</main>
<script>
(() => {
  const $ = (s) => document.querySelector(s);
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const token = location.hash.slice(1);
  // El link no queda en el historial ni en la barra
  history.replaceState(null, '', '/restablecer');
  const err = $('[data-error]');
  if (!token) err.innerHTML = '<div class="aviso error">Abrí el link completo que te enviaron.</div>';
  $('#f-nueva').addEventListener('submit', async (e) => {
    e.preventDefault();
    err.innerHTML = '';
    if ($('#n-pass').value !== $('#n-pass2').value) { err.innerHTML = '<div class="aviso error">Las contraseñas no coinciden.</div>'; return; }
    const btn = e.target.querySelector('button'); btn.disabled = true;
    try {
      const res = await fetch('/api/restablecer', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ token, password: $('#n-pass').value }) });
      const d = await res.json();
      if (!res.ok) throw new Error(d.error || 'Error');
      try { localStorage.setItem('tt_sesion', d.token); } catch {}
      location.href = '/panel';
    } catch (x) { err.innerHTML = `<div class="aviso error">${esc(x.message)}</div>`; btn.disabled = false; }
  });
})();
</script>
</body>
</html>
